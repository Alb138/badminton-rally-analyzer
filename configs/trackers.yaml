# Shuttle trackers that scripts/eval_trackers.py can score (each section goes to make_tracker).
tracknetv3:
  kind: tracknetv3
  repo_dir: third_party/TrackNetV3
  tracknet_ckpt: third_party/TrackNetV3/ckpts/TrackNet_best.pt
  inpaintnet_ckpt: third_party/TrackNetV3/ckpts/InpaintNet_best.pt
  work_dir: outputs/_tracknet
  batch_size: 2
tracknet:
  kind: tracknet
  weights: models/tracknet_best.pt   # from scripts/train_tracknet.py (Kaggle or local)
  batch_size: 4
  threshold: 0.5
yolo:
  kind: yolo
  weights: models/yolo_best.pt   # from scripts/train_yolo.py (Kaggle or local)
  conf: 0.25
  imgsz: 1280
