[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-analyzer"
version = "0.1.0"
description = "Badminton rally analyzer: shuttle tracking, player pose, shot recognition and rally stats from video."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "opencv-python>=4.9",
    "pyyaml>=6",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.3",
    "gradio>=5",
    "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tracknetv3 = [
    "parse>=1.22.4",
    "pycocotools>=2.0.11",
]

[project.scripts]
badminton-analyze = "badminton_analyzer.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real models or data"]
